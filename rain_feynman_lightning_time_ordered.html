name=gl?'クォークどうしの散乱(グルーオンの交換)':'電子どうしの散乱(光子の交換)';
}else if(type===2){
var A0=V(-15,55),Pp=V(15,55),W1=V(0,36),W2=V(0,17),O1=V(-15,0),O2=V(15,0);
ln(A0,W1,'s',1,0);ln(Pp,W1,'w',0,0);ln(W1,W2,'s',1,1);ln(W2,O1,'s',1,2);ln(W2,O2,'w',0,2);
Vt=[[W1,0],[W2,1]];
name='コンプトン散乱(電子が光子を吸収して、また放出)';
}else{
var T0=V(0,55),U1=V(0,40),U2=V(0,22),B0=V(0,0);
ln(T0,U1,'w',0,0);ln(U2,B0,'w',0,2);
P.push({pts:arc(0,31,9,Math.PI/2,Math.PI*1.5),stage:1,ar:[V(-9,31),V(0,-1)]});
P.push({pts:arc(0,31,9,Math.PI/2,-Math.PI/2),stage:1,ar:[V(9,31),V(0,1)]});
Vt=[[U1,0],[U2,1]];
name='真空偏極(光子が一瞬だけ粒子と反粒子の輪になる)';
}
return {P:P,V:Vt,name:name};
}

var STG=[{s:0,d:0.38},{s:0.44,d:0.32},{s:0.84,d:0.4}],DRAW=1.3;
var bolts=[],flash=0;
var coneG=new THREE.ConeGeometry(1.1,2.6,10),sphG=new THREE.SphereGeometry(0.95,10,8);
var nameEl=document.getElementById('name'),nameT=null;
function spawnBolt(){
var type=Math.floor(Math.random()*5),dg=diagram(type);
var g=new THREE.Group();
var core=new THREE.MeshBasicMaterial({color:0xeef5ff,transparent:true,opacity:1,blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
var glow=new THREE.MeshBasicMaterial({color:0x7aa8ff,transparent:true,opacity:0.3,blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
var items=[],geos=[];
dg.P.forEach(function(p){
var cu=new THREE.CatmullRomCurve3(p.pts),sg=Math.max(8,p.pts.length*2);
var g1=new THREE.TubeGeometry(cu,sg,0.34,6,false),g2=new THREE.TubeGeometry(cu,sg,1.0,6,false);geos.push(g1,g2);
g.add(new THREE.Mesh(g1,core));g.add(new THREE.Mesh(g2,glow));
var ar=null;
if(p.ar){ar=new THREE.Mesh(coneG,core);ar.position.copy(p.ar[0]);ar.rotation.z=Math.atan2(p.ar[1].y,p.ar[1].x)-Math.PI/2;ar.visible=false;g.add(ar);}
var st=STG[p.stage];
items.push({g1:g1,g2:g2,n1:g1.index.count,n2:g2.index.count,t0:st.s,d:st.d,ar:ar});
});
var verts=dg.V.map(function(v){var m=new THREE.Mesh(sphG,core);m.position.copy(v[0]);m.visible=false;g.add(m);var st=STG[v[1]];return {m:m,t:st.s+st.d};});
var fh=new THREE.Vector3();camera.getWorldDirection(fh);fh.y=0;fh.normalize();
var rt=new THREE.Vector3(fh.z,0,-fh.x);
var dist=(view==='fps')?65+Math.random()*25:80+Math.random()*15,lat=(Math.random()<0.5?-1:1)*(18+Math.random()*14);
var bx=camera.position.x+fh.x*dist+rt.x*lat,bz=camera.position.z+fh.z*dist+rt.z*lat;
g.position.set(bx,0,bz);g.rotation.y=Math.atan2(camera.position.x-bx,camera.position.z-bz);
scene.add(g);
var lt=new THREE.PointLight(0xcfe0ff,0,170);lt.position.set(bx,30,bz);scene.add(lt);
bolts.push({g:g,core:core,glow:glow,geos:geos,lt:lt,items:items,verts:verts,t:0});
nameEl.textContent='いまの雷: '+dg.name;nameEl.style.opacity='1';clearTimeout(nameT);nameT=setTimeout(function(){nameEl.style.opacity='0';},5000);
}
function opac(t){
if(t<DRAW)return 1;
var u=t-DRAW;
if(u<0.1)return 1;if(u<0.2)return 0.15;if(u<0.3)return 1;
return Math.max(0,1-(u-0.3)/1.4);
}

var n=1,nT=1,r=0,rT=1,view='out',strikeT=1.2;
function applyEnv(dt){
n+=(nT-n)*Math.min(1,dt*2);r+=(rT-r)*Math.min(1,dt*1.5);
var base=lc(lc(0x87ceeb,0x070b1e,n),lc(0x6e7b88,0x0b0e18,n),r);
base.lerp(new THREE.Color(0xdfe8ff),Math.min(0.4,flash*0.4));
scene.background=base;scene.fog.color.copy(base);scene.fog.near=120-80*r;scene.fog.far=330-190*r;
amb.intensity=(0.8-0.45*n)*(1-0.3*r)+flash*0.7;amb.color.copy(lc(0xffffff,0xa8b8ff,n));
sunL.intensity=(0.75-0.42*n)*(1-0.7*r);
groundMat.color.copy(lc(lc(0x5fa04e,0x1e3d2c,n),0x2f4a30,r*0.45));
plazaMat.color.copy(lc(lc(0xcdbf9f,0x5a5568,n),0x4a4a55,r*0.35));
leafMat.color.copy(lc(lc(0x2f7a3a,0x143020,n),0x1f4a2a,r*0.3));
cloudMat.color.copy(lc(0x555e69,0x20252d,n));cloudMat.opacity=r*0.95;deck.visible=r>0.02;
starsMat.opacity=n*(1-r);
wcMat.opacity=(1-n)*(1-r)*0.9;
rmat.opacity=0.5*r;rain.visible=r>0.02;
}

var ctl=document.getElementById('ctl'),bEl={};
function mkBtn(id,label,fn){var b=document.createElement('button');b.textContent=label;b.addEventListener('click',fn);ctl.appendChild(b);bEl[id]=b;}
function sty(){
[['day',nT===0],['night',nT===1],['clear',rT===0],['rainy',rT===1],['out',view==='out'],['fps',view==='fps']].forEach(function(a){bEl[a[0]].style.background=a[1]?'#f2d48a':'rgba(27,24,48,0.9)';bEl[a[0]].style.color=a[1]?'#1b1830':'#fff';});
document.getElementById('hint').textContent=view==='out'?'ドラッグで視点を回せます。雨の間、ときどき雷が落ちます':'FPS: 地上から空を見上げています。ドラッグで見回せます';
}
mkBtn('day','昼',function(){nT=0;sty();});
mkBtn('night','夜',function(){nT=1;sty();});
mkBtn('clear','晴れ',function(){rT=0;sty();});
mkBtn('rainy','雨',function(){rT=1;sty();});
mkBtn('out','俯瞰',function(){view='out';auto=true;sty();});
mkBtn('fps','FPS',function(){view='fps';yaw=0;pitch=0.35;sty();});
mkBtn('strike','雷を落とす',function(){rT=1;strikeT=0;sty();});
var yaw=0,pitch=0.35,theta=0.2,phi=1.35,auto=true,dragging=false,lx=0,ly=0;
sty();
cv.addEventListener('pointerdown',function(e){dragging=true;auto=false;lx=e.clientX;ly=e.clientY;cv.style.cursor='grabbing';cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',function(e){
if(!dragging)return;
var dx=e.clientX-lx,dy=e.clientY-ly;
if(view==='fps'){yaw-=dx*0.005;pitch=Math.max(-0.3,Math.min(1.4,pitch-dy*0.004));}
else{theta-=dx*0.006;phi=Math.max(0.5,Math.min(1.5,phi-dy*0.006));}
lx=e.clientX;ly=e.clientY;
});
function up(){dragging=false;cv.style.cursor='grab';}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

var oT=new THREE.Vector3(0,22,0),tmp=new THREE.Vector3(),last=0;
function loop(ts){
var t=ts/1000,dt=Math.min(0.05,t-last);last=t;
applyEnv(dt);
if(r>0.6){strikeT-=dt;if(strikeT<=0){spawnBolt();strikeT=6+Math.random()*4;}}
flash=0;
for(var b=bolts.length-1;b>=0;b--){
var bo=bolts[b];bo.t+=dt;var bt=bo.t,op=opac(bt);
bo.items.forEach(function(it){
var p=Math.max(0,Math.min(1,(bt-it.t0)/it.d));
it.g1.setDrawRange(0,Math.floor(it.n1*p/6)*6);it.g2.setDrawRange(0,Math.floor(it.n2*p/6)*6);
if(it.ar)it.ar.visible=p>=0.5;
});
bo.verts.forEach(function(v){
var u=(bt-v.t)/0.12;v.m.visible=u>=0;
var sc=u<0?0:(u<1?1.7*u:Math.max(1,1.7-(u-1)*2));v.m.scale.set(sc,sc,sc);
});
bo.core.opacity=op;bo.glow.opacity=0.3*op;
bo.lt.intensity=3.5*op*(0.3+0.7*Math.min(1,bt/DRAW));
flash=Math.max(flash,op*Math.min(1,bt/DRAW));
if(bt>DRAW+1.9){scene.remove(bo.g);scene.remove(bo.lt);bo.geos.forEach(function(g){g.dispose();});bolts.splice(b,1);}
}
if(rain.visible){
var spd=48*dt;
for(var i=0;i<RN;i++){
ry[i]-=spd;if(ry[i]<0)ry[i]+=70;
var k=i*6;rpos[k]=rx[i];rpos[k+1]=ry[i];rpos[k+2]=rz[i];rpos[k+3]=rx[i]+0.25;rpos[k+4]=ry[i]+1.5;rpos[k+5]=rz[i];
}
rgeo.attributes.position.needsUpdate=true;
}
if(view==='fps'){
camera.position.set(0,1.7,28);camera.up.set(0,1,0);camera.fov=75;
tmp.set(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch)).add(camera.position);
camera.lookAt(tmp);
}else{
camera.fov=55;camera.up.set(0,1,0);
var th=auto?theta+Math.sin(t*0.08)*0.35:theta;
camera.position.set(oT.x+85*Math.sin(phi)*Math.sin(th),oT.y+85*Math.cos(phi),oT.z+85*Math.sin(phi)*Math.cos(th));
camera.lookAt(oT);
}
camera.updateProjectionMatrix();
renderer.render(scene,camera);
requestAnimationFrame(loop);
}
window.addEventListener('resize',function(){W=wrap.clientWidth;H=wrap.clientHeight;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();});
requestAnimationFrame(loop);
})();
</script>
</div></body></html>
