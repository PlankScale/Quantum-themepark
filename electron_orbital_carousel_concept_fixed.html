var k=o.s0/HW,x=rx*k,y=rz*k,z=ry*k,r=Math.sqrt(x*x+y*y+z*z)+1e-9,p=o.f(x,y,z,r);return p*p;
}
function prep(o){
if(o.ref)return;
var mx=0,i,rx,ry,rz;
for(i=0;i<8000;i++){rx=(Math.random()*2-1)*20;ry=(Math.random()*2-1)*20;rz=(Math.random()*2-1)*20;var d=rhoOf(o,rx,ry,rz);if(d>mx)mx=d;}
o.ref=mx*1.05+1e-12;o.eps=o.ref*1e-5;
var pts=new Float32Array(3600*3),cnt=0,tries=0;
while(cnt<3600&&tries<400000){tries++;rx=(Math.random()*2-1)*24;ry=(Math.random()*2-1)*24;rz=(Math.random()*2-1)*24;if(Math.random()*o.ref<rhoOf(o,rx,ry,rz)){pts[cnt*3]=rx;pts[cnt*3+1]=ry;pts[cnt*3+2]=rz;cnt++;}}
for(var q=cnt;q<3600;q++){pts[q*3]=0;pts[q*3+1]=-1000;pts[q*3+2]=0;}
o.pts=pts;
}
var cloudGeo=new THREE.BufferGeometry(),cpos=new Float32Array(3600*3);cloudGeo.setAttribute('position',new THREE.BufferAttribute(cpos,3));
var cloudMat=new THREE.PointsMaterial({map:rad([[0,'rgba(255,255,255,1)'],[0.5,'rgba(255,255,255,0.4)'],[1,'rgba(255,255,255,0)']],64),size:0.55,transparent:true,opacity:0.3,depthWrite:false,blending:THREE.AdditiveBlending,color:0x88ccff,fog:false});
var cloud=new THREE.Points(cloudGeo,cloudMat);cloud.position.copy(HUB);cloud.frustumCulled=false;scene.add(cloud);

function mkUni(col,maneCol){
var g=new THREE.Group();g.rotation.order='YXZ';
var wh=pm(col),mane=pm(maneCol),gold=pm(0xffd860,0x332200),legs=[];
sph(0.5,0.52,0.95,0,1.55,0,wh,g);sph(0.46,0.5,0.5,0,1.65,0.62,wh,g);sph(0.5,0.5,0.55,0,1.55,-0.62,wh,g);
var nk=cyl(0.2,0.3,0.9,0,2.1,1.0,wh,10,g);nk.rotation.x=0.65;
sph(0.24,0.26,0.44,0,2.5,1.45,wh,g);sph(0.17,0.17,0.22,0,2.36,1.8,wh,g);
var hn=new THREE.Mesh(new THREE.ConeGeometry(0.075,0.95,10),gold);hn.position.set(0,3.05,1.6);hn.rotation.x=0.4;g.add(hn);
for(var q=0;q<4;q++){var rg=new THREE.Mesh(new THREE.TorusGeometry(0.06-q*0.011,0.014,5,10),gold);rg.position.set(0,2.8+q*0.17,1.5+q*0.07);rg.rotation.x=0.4+Math.PI/2;g.add(rg);}
[-1,1].forEach(function(s){var ea=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.2,6),wh);ea.position.set(s*0.14,2.8,1.28);g.add(ea);});
for(var m=0;m<7;m++)sph(0.1,0.13,0.1,0,2.75-m*0.14,1.15-m*0.19,mane,g);
for(var t=0;t<5;t++)sph(0.11-t*0.012,0.11-t*0.012,0.2,0,1.75-t*0.28,-1.15-t*0.15,mane,g);
[[-0.28,0.65],[0.28,0.65],[-0.28,-0.65],[0.28,-0.65]].forEach(function(p){
var lg=new THREE.Group();lg.position.set(p[0],1.2,p[1]);g.add(lg);
var up=new THREE.Mesh(new THREE.CylinderGeometry(0.11,0.08,0.6,8),wh);up.position.y=-0.3;lg.add(up);
var lo=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.06,0.55,8),wh);lo.position.y=-0.85;lg.add(lo);
var hf=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,0.12,8),gold);hf.position.y=-1.15;lg.add(hf);
legs.push(lg);
});
box(0.9,0.12,0.7,0,2.12,-0.05,pm(0xb02a3a),g);
return {g:g,legs:legs};
}
var uniCols=[0xffffff,0xffe6f0,0xe8e0ff,0xe0fff0,0xfff6dc,0xe0f0ff,0xffe0e0,0xf0e0ff],maneCols=[0xff7ab8,0x8a7aff,0x6ad0ff,0xffb84a,0x7aff9a,0xff6a6a,0x6a8aff,0xc86aff];
var N=8,unis=[],armM=new THREE.MeshPhongMaterial({color:0xc9a227,shininess:70,transparent:true,opacity:0.85});
var riderCols=[0xf2d48a,0x7fb7e6,0xe0a050,0x6bbf8a,0xc77bd0,0xe06a6a,0x8aa0e0,0xd8d070];
for(var ui=0;ui<N;ui++){
var mu=mkUni(uniCols[ui],maneCols[ui]);scene.add(mu.g);
var rb=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.28,0.65,10),lam(riderCols[ui]));rb.position.set(0,2.5,-0.05);mu.g.add(rb);
var rh=new THREE.Mesh(new THREE.SphereGeometry(0.2,12,10),lam(0xf1c9a0));rh.position.set(0,3.0,-0.02);mu.g.add(rh);
var arm=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1,8),armM);scene.add(arm);
var ang=ui/N*Math.PI*2,home=V(Math.cos(ang)*9.5,0.9+1.65,Math.sin(ang)*9.5);
unis.push({m:mu,arm:arm,X:home.clone(),V:V(0,0,0),home:home,yaw:ang+Math.PI/2,pitch:0,phase:Math.random()*6,rider:rb,head:rh});
}
var youRing=new THREE.Sprite(new THREE.SpriteMaterial({map:rad([[0,'rgba(255,230,140,0.0)'],[0.6,'rgba(255,220,100,0.0)'],[0.75,'rgba(255,230,120,0.9)'],[1,'rgba(255,220,100,0)']],128),transparent:true,depthWrite:false,fog:false}));
youRing.scale.set(5,5,1);scene.add(youRing);
var flash=new THREE.Sprite(new THREE.SpriteMaterial({map:rad([[0,'rgba(255,255,255,0.95)'],[0.4,'rgba(160,200,255,0.5)'],[1,'rgba(120,160,255,0)']],128),transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));flash.position.copy(HUB);scene.add(flash);

var oname=document.getElementById('oname'),oqn=document.getElementById('oqn'),omsg=document.getElementById('omsg');
var mode='idle',oi=0,orb=ORBS[0],tOrb=0,ORBT=18,autoSw=true,landT=0,flashT=0;
function showOrb(){
if(mode==='idle'||mode==='land'){oname.textContent='停止中';oqn.textContent='ユニコーンに乗ると動き出します';return;}
if(orb.crazy){oname.textContent=orb.id;oqn.textContent='架空軌道(量子数なし。自由に設計した確率分布)';}
else{oname.textContent=orb.id;oqn.textContent='n = '+orb.n+', l = '+orb.l+', m = '+(orb.m?'+'+orb.m:'0')+'   E = '+orb.E.toFixed(1)+' eV';}
}
function setOrb(i,silent){
var prev=orb;oi=i;orb=ORBS[i];prep(orb);tOrb=0;
for(var k=0;k<3600*3;k++)cpos[k]=orb.pts[k];cloudGeo.attributes.position.needsUpdate=true;
cloudMat.color.set(orb.crazy?0xff9ae0:(orb.n===1?0x88ccff:(orb.n===2?0x88ffc0:(orb.n===3?0xffe088:0xff9a88))));
if(!silent){
flashT=1;
var msg;
if(prev.crazy||orb.crazy)msg='遷移: '+prev.id+' → '+orb.id+'(現実にはない遷移)';
else if(prev.n===orb.n)msg='遷移: '+prev.id+' → '+orb.id+'(同じエネルギー準位)';
else{var dE=13.6*(1/(prev.n*prev.n)-1/(orb.n*orb.n));msg='遷移: '+prev.id+' → '+orb.id+'(光子 '+Math.abs(dE).toFixed(1)+' eV を'+(dE<0?'吸収':'放出')+')';}
omsg.textContent=msg;
}
showOrb();
}
var sigma2=5,gam=0.9,KB=26,hh=0.3;
var gr=V(0,0,0);
function lnr(rx,ry,rz){return Math.log(rhoOf(orb,rx,ry,rz)+orb.eps);}
function gradLn(rx,ry,rz,out){
out.set((lnr(rx+hh,ry,rz)-lnr(rx-hh,ry,rz))/(2*hh),(lnr(rx,ry+hh,rz)-lnr(rx,ry-hh,rz))/(2*hh),(lnr(rx,ry,rz+hh)-lnr(rx,ry,rz-hh))/(2*hh));
var l=out.length();if(l>3)out.multiplyScalar(3/l);return out;
}
function stepUni(u,dt){
var rx=u.X.x,ry=u.X.y-CY,rz=u.X.z;
gradLn(rx,ry,rz,gr);
var sq=Math.sqrt(2*gam*sigma2*dt);
u.V.x+=(sigma2*gr.x-gam*u.V.x)*dt+sq*randn();u.V.y+=(sigma2*gr.y-gam*u.V.y)*dt+sq*randn();u.V.z+=(sigma2*gr.z-gam*u.V.z)*dt+sq*randn();
var bx=0,bz=0;
if(!orb.crazy&&orb.m){var rc2=Math.max(rx*rx+rz*rz,4),w=orb.m*KB/rc2;bx=-w*rz;bz=w*rx;}
u.X.x+=(u.V.x+bx)*dt;u.X.y+=u.V.y*dt;u.X.z+=(u.V.z+bz)*dt;
var d=Math.sqrt(rx*rx+ry*ry+rz*rz);if(d>34){var f=34/d;u.X.x*=f;u.X.z*=f;u.X.y=CY+ry*f;u.V.multiplyScalar(0.5);}
if(u.X.y<2.6){u.X.y=2.6;if(u.V.y<0)u.V.y*=-0.4;}
}

var ctl=document.getElementById('ctl'),vctl=document.getElementById('vctl'),bEl={};
function mkBtn(id,label,fn,par){var b=document.createElement('button');b.textContent=label;b.addEventListener('click',fn);(par||ctl).appendChild(b);bEl[id]=b;return b;}
var view='out',yaw=0,pitch=0,theta=0.3,phi=1.2,auto=true;
function sty(){
[['out',view==='out'],['tps',view==='tps'],['fps',view==='fps']].forEach(function(a){bEl[a[0]].style.background=a[1]?'#f2d48a':'rgba(27,24,48,0.9)';bEl[a[0]].style.color=a[1]?'#1b1830':'#fff';});
ORBS.forEach(function(o,i){var on=(mode==='ride'&&i===oi);bEl['o'+i].style.background=on?'#f2d48a':'rgba(27,24,48,0.9)';bEl['o'+i].style.color=on?'#1b1830':'#fff';});
bEl.ride.textContent=(mode==='ride')?'降りる':'ユニコーンに乗る';
bEl.auto.textContent='自動切替: '+(autoSw?'ON':'OFF');
var h={out:'俯瞰: ドラッグで視点を回せます。ユニコーンは確率の高い場所に集まります',tps:'TPS: 金の輪のユニコーン(あなた)を後ろから追います',fps:'FPS: あなたのユニコーンからの視点です。ドラッグで見回せます'};
document.getElementById('hint').textContent=h[view];
}
mkBtn('out','俯瞰',function(){view='out';auto=true;sty();},vctl);
mkBtn('tps','TPS',function(){view='tps';sty();},vctl);
mkBtn('fps','FPS',function(){view='fps';yaw=0;pitch=0;sty();},vctl);
mkBtn('ride','ユニコーンに乗る',function(){
if(mode==='ride'){mode='land';landT=0;showOrb();omsg.textContent='';}
else{mode='ride';unis.forEach(function(u){u.V.set(0,0,0);});setOrb(0,true);omsg.textContent='';}
sty();
});
mkBtn('auto','',function(){autoSw=!autoSw;sty();});
ORBS.forEach(function(o,i){mkBtn('o'+i,o.id,function(){if(mode!=='ride'){mode='ride';unis.forEach(function(u){u.V.set(0,0,0);});setOrb(i,true);}else setOrb(i,false);sty();});});
setOrb(0,true);showOrb();sty();

var dragging=false,lx=0,ly=0;
cv.addEventListener('pointerdown',function(e){dragging=true;auto=false;lx=e.clientX;ly=e.clientY;cv.style.cursor='grabbing';cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',function(e){
if(!dragging)return;
var dx=e.clientX-lx,dy=e.clientY-ly;
if(view==='fps'){yaw=Math.max(-2.6,Math.min(2.6,yaw-dx*0.005));pitch=Math.max(-1.2,Math.min(1.2,pitch-dy*0.004));}
else{theta-=dx*0.006;phi=Math.max(0.3,Math.min(1.55,phi-dy*0.006));}
lx=e.clientX;ly=e.clientY;
});
function up(){dragging=false;cv.style.cursor='grab';}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

var hd=V(0,0,1),tmp=V(0,0,0),oT=V(0,14,0),last=0;
function frame(ts){
var t=ts/1000,dt=Math.min(0.05,t-last);last=t;
if(mode==='ride'){
for(var ss=0;ss<2;ss++)unis.forEach(function(u){stepUni(u,dt/2);});
tOrb+=dt;if(autoSw&&tOrb>(orb.crazy?12:ORBT))setOrb((oi+1)%ORBS.length,false);
cloudMat.opacity=0.3;
}else if(mode==='land'){
landT+=dt;var all=true;
unis.forEach(function(u){u.X.lerp(u.home,Math.min(1,dt*1.0));u.V.multiplyScalar(0.9);if(u.X.distanceTo(u.home)>0.15)all=false;});
cloudMat.opacity=Math.max(0,cloudMat.opacity-dt*0.2);
if(all||landT>9){mode='idle';unis.forEach(function(u){u.X.copy(u.home);u.V.set(0,0,0);});showOrb();sty();}
}else{
cloudMat.opacity=Math.max(0,cloudMat.opacity-dt*0.5);
}
if(flashT>0){flashT=Math.max(0,flashT-dt*1.2);flash.material.opacity=flashT;var fs=4+(1-flashT)*26;flash.scale.set(fs,fs,1);}
unis.forEach(function(u,i){
var sp=u.V.length(),hs=Math.sqrt(u.V.x*u.V.x+u.V.z*u.V.z);
if(mode==='ride'&&hs>0.3){var ty=Math.atan2(u.V.x,u.V.z),dyw=ty-u.yaw;while(dyw>Math.PI)dyw-=Math.PI*2;while(dyw<-Math.PI)dyw+=Math.PI*2;u.yaw+=dyw*Math.min(1,dt*3);}
else if(mode==='idle'){u.yaw=Math.atan2(-u.home.z,u.home.x)+Math.PI;}
var tp=(mode==='ride')?Math.max(-0.5,Math.min(0.5,-u.V.y*0.1)):0;u.pitch+=(tp-u.pitch)*Math.min(1,dt*3);
u.m.g.position.set(u.X.x,u.X.y-1.65,u.X.z);u.m.g.rotation.y=u.yaw;u.m.g.rotation.x=u.pitch;
var ph=(mode==='ride')?sp:0;u.phase+=dt*(ph*1.3);
var am=Math.min(0.7,0.1+ph*0.12),sw=Math.sin(u.phase*2);
u.m.legs[0].rotation.x=sw*am;u.m.legs[3].rotation.x=sw*am;u.m.legs[1].rotation.x=-sw*am;u.m.legs[2].rotation.x=-sw*am;
var tp2=V(u.X.x,u.X.y+0.3,u.X.z),dv=tp2.clone().sub(HUB),len=dv.length();
u.arm.position.copy(HUB).add(tp2).multiplyScalar(0.5);u.arm.scale.set(1,len,1);u.arm.quaternion.setFromUnitVectors(UP,dv.normalize());
});
var you=unis[0];
youRing.position.set(you.X.x,you.X.y+2.4,you.X.z);youRing.visible=(mode==='ride');
if(mode==='ride'&&you.V.length()>0.4){tmp.copy(you.V).normalize();hd.lerp(tmp,Math.min(1,dt*2)).normalize();}
you.head.visible=(view!=='fps');
if(view==='fps'){
camera.position.set(you.X.x,you.X.y+1.7,you.X.z);camera.up.set(0,1,0);camera.fov=75;
var by=Math.atan2(hd.x,hd.z),bp=Math.asin(Math.max(-1,Math.min(1,hd.y)))*0.6,yy=by+yaw,pp=bp+pitch;
tmp.set(Math.sin(yy)*Math.cos(pp),Math.sin(pp),Math.cos(yy)*Math.cos(pp)).add(camera.position);camera.lookAt(tmp);
}else if(view==='tps'){
camera.up.set(0,1,0);camera.fov=55;
camera.position.set(you.X.x-hd.x*9,you.X.y+4.5-hd.y*3,you.X.z-hd.z*9);camera.lookAt(you.X.x,you.X.y+1,you.X.z);
}else{
camera.fov=55;camera.up.set(0,1,0);
var th=auto?theta+Math.sin(t*0.07)*0.4:theta;
camera.position.set(oT.x+78*Math.sin(phi)*Math.sin(th),oT.y+78*Math.cos(phi),oT.z+78*Math.sin(phi)*Math.cos(th));
camera.lookAt(oT);
}
camera.updateProjectionMatrix();
renderer.render(scene,camera);
requestAnimationFrame(frame);
}
window.addEventListener('resize',function(){W=wrap.clientWidth;Hh=wrap.clientHeight;renderer.setSize(W,Hh,false);camera.aspect=W/Hh;camera.updateProjectionMatrix();});
requestAnimationFrame(frame);
})();
</script>
</div></body></html>
