var eg=new THREE.Group();eg.position.set(s*0.05,0.012,0.083);headG.add(eg);
var em=new THREE.MeshBasicMaterial({color:0xb5d43a});
var iris=new THREE.Mesh(new THREE.SphereGeometry(0.026,14,10),em);iris.scale.set(1.1,0.95,0.5);eg.add(iris);
var pupil=new THREE.Mesh(new THREE.SphereGeometry(0.026,10,8),new THREE.MeshBasicMaterial({color:0x000000}));pupil.scale.set(0.2,0.9,0.2);pupil.position.z=0.008;eg.add(pupil);
var gl=new THREE.Sprite(new THREE.SpriteMaterial({map:eyeGlowTex,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));gl.position.z=0.02;gl.scale.set(0.1,0.1,1);eg.add(gl);
eyes.push({em:em,pupil:pupil,gl:gl});
});
[-1,1].forEach(function(s){
var pts=[];for(var w=0;w<3;w++){pts.push(new THREE.Vector3(s*0.03,-0.02-w*0.012,0.12),new THREE.Vector3(s*0.17,0.0-w*0.03,0.1));}
headG.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),whMat));
});
var legs=[];
[[-0.08,0.3,0.22],[0.08,0.3,0.22],[-0.09,0.3,-0.2],[0.09,0.3,-0.2]].forEach(function(p){
var lg=new THREE.Group();lg.position.set(p[0],p[1],p[2]);root.add(lg);
var cy=new THREE.Mesh(new THREE.CylinderGeometry(0.036,0.028,0.3,8),catMat);cy.position.y=-0.15;cy.castShadow=true;lg.add(cy);
sph(0.034,0.025,0.05,0,-0.3,0.014,lg);
legs.push(lg);
});
var tail=[],par=new THREE.Group();par.position.set(0,0.42,-0.36);root.add(par);
var cur=par;
for(var t=0;t<7;t++){
var sg=new THREE.Group();sg.rotation.x=(t===0)?-1.5:0.26;if(t>0)sg.position.y=0.085;cur.add(sg);
var cs=new THREE.Mesh(new THREE.CylinderGeometry(0.02+0.008*(6-t)/6,0.03-0.002*t,0.095,8),catMat);cs.position.y=0.04;cs.castShadow=true;sg.add(cs);
tail.push(sg);cur=sg;
}
return {root:root,bodyG:bodyG,headG:headG,legs:legs,tail:tail,eyes:eyes};
}

var cats=[],catId=0,logs=[];
var visitor={x:0,z:20,yaw:Math.PI,pitch:0.0,tx:null,tz:null};
var view='out';
function addLog(s){logs.unshift(s);if(logs.length>6)logs.pop();}
function spawnCat(){
var free=boxes.filter(function(b){return !b.occ&&!b.resv;});
if(!free.length){addLog('空いている箱がありません');return;}
var m=mkCat();m.root.scale.setScalar(CATS);scene.add(m.root);
var a=Math.random()*6.28,d=8+Math.random()*16;
var c={id:++catId,m:m,x:Math.cos(a)*d,z:Math.sin(a)*d,yaw:Math.random()*6.28,state:'wander',tx:null,tz:null,idleT:0,speed:1.2,phase:Math.random()*6,curious:false,curT:2+Math.random()*3,contactT:0,flash:0,box:null,jt:0,jfrom:new THREE.Vector3(),jto:new THREE.Vector3(),headY:0};
m.root.position.set(c.x,0,c.z);cats.push(c);
}
function resetAll(){
cats.forEach(function(c){scene.remove(c.m.root);});cats=[];
boxes.forEach(function(b){b.occ=false;b.resv=false;b.closed=false;b.lidT=0;b.cat=null;b.flaps.forEach(function(f){f.rotation.x=f.userData.open;});});
logs=[];
for(var i=0;i<3;i++)spawnCat();
}
function angDiff(a,b){var d=a-b;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;return d;}

var ctl=document.getElementById('ctl'),bEl={};
function mkBtn(id,label,fn){var b=document.createElement('button');b.textContent=label;b.addEventListener('click',fn);ctl.appendChild(b);bEl[id]=b;}
var night=1,nT=1,auto=true,theta=0.2,phi=1.1;
function sty(){
[['out',view==='out'],['fps',view==='fps'],['night',nT===1],['day',nT===0]].forEach(function(a){bEl[a[0]].style.background=a[1]?'#f2d48a':'rgba(27,24,48,0.9)';bEl[a[0]].style.color=a[1]?'#1b1830':'#fff';});
document.getElementById('hint').textContent=view==='out'?'地面をクリックして歩く。猫のほうを向くと目が合います。ドラッグで視点を回せます':'FPS: 地面をクリックして歩く。ドラッグで見回す。猫と目を合わせてみてください';
}
mkBtn('out','俯瞰',function(){view='out';auto=true;sty();});
mkBtn('fps','FPS',function(){view='fps';sty();});
mkBtn('night','夜',function(){nT=1;sty();});
mkBtn('day','昼',function(){nT=0;sty();});
mkBtn('spawn','猫を放つ',function(){spawnCat();});
mkBtn('reset','リセット',function(){resetAll();});
sty();

var vg=new THREE.Group();
var vb=new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.3,1.0,10),lam(0x7fb7e6));vb.position.y=0.8;vb.castShadow=true;vg.add(vb);
var vh=new THREE.Mesh(new THREE.SphereGeometry(0.22,12,10),lam(0xf1c9a0));vh.position.y=1.5;vg.add(vh);
var vn=new THREE.Mesh(new THREE.ConeGeometry(0.06,0.14,8),lam(0xf1c9a0));vn.rotation.x=Math.PI/2;vn.position.set(0,1.48,0.24);vg.add(vn);
var vl=new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.2,0.5,8),lam(0x34384a));vl.position.y=0.25;vg.add(vl);
scene.add(vg);
var vring=new THREE.Mesh(new THREE.RingGeometry(0.3,0.42,20),new THREE.MeshBasicMaterial({color:0xf2d48a,transparent:true,opacity:0.8,side:THREE.DoubleSide}));vring.rotation.x=-Math.PI/2;vring.position.y=0.05;vring.visible=false;scene.add(vring);

var ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),0),hitp=new THREE.Vector3();
var dragging=false,lx=0,ly=0,moved=0;
cv.addEventListener('pointerdown',function(e){dragging=true;auto=false;lx=e.clientX;ly=e.clientY;moved=0;cv.style.cursor='grabbing';cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',function(e){
if(!dragging)return;
var dx=e.clientX-lx,dy=e.clientY-ly;moved+=Math.abs(dx)+Math.abs(dy);
if(view==='fps'){visitor.yaw-=dx*0.005;visitor.pitch=Math.max(-0.6,Math.min(1.0,visitor.pitch-dy*0.004));}
else{theta-=dx*0.006;phi=Math.max(0.3,Math.min(1.5,phi-dy*0.006));}
lx=e.clientX;ly=e.clientY;
});
cv.addEventListener('pointerup',function(e){
dragging=false;cv.style.cursor='grab';
if(moved<6){
var r=cv.getBoundingClientRect();
ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1);
ray.setFromCamera(ndc,camera);
if(ray.ray.intersectPlane(plane,hitp)){
var d=Math.sqrt(hitp.x*hitp.x+hitp.z*hitp.z);
if(d<36){visitor.tx=hitp.x;visitor.tz=hitp.z;vring.position.set(hitp.x,0.05,hitp.z);vring.visible=true;}
}
}
});
cv.addEventListener('pointercancel',function(){dragging=false;});

var hud=document.getElementById('hud'),hx=hud.getContext('2d');
function drawHud(){
hx.clearRect(0,0,260,170);
hx.font='12px "Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif';hx.textBaseline='middle';hx.textAlign='left';
var inb=cats.filter(function(c){return c.state==='inbox';}).length;
hx.fillStyle='#f2d48a';hx.fillText('園内の猫: '+cats.length+'匹(箱に入った: '+inb+'匹)',10,14);
hx.font='11px "Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif';
for(var i=0;i<6;i++){hx.fillStyle=i===0?'#ffffff':'#a8a2bd';hx.fillText(logs[i]||'',10,38+i*20);}
}
var contactEl=document.getElementById('contact'),contactTO=null;
function showContact(){contactEl.style.opacity='1';clearTimeout(contactTO);contactTO=setTimeout(function(){contactEl.style.opacity='0';},900);}

var v1=new THREE.Vector3(),v2=new THREE.Vector3(),fq=new THREE.Quaternion(),oT=new THREE.Vector3(0,1,2),last=0;
function update(c,t,dt){
var m=c.m;
var eyeH=new THREE.Vector3(visitor.x,1.6,visitor.z);
if(c.state==='wander'||c.state==='idle'){
if(c.state==='idle'){c.idleT-=dt;if(c.idleT<=0){c.state='wander';c.tx=null;}}
else{
if(c.tx===null){var a=Math.random()*6.28,d=Math.random()*26;c.tx=Math.cos(a)*d;c.tz=Math.sin(a)*d;c.speed=1.0+Math.random()*0.5;}
var dx=c.tx-c.x,dz=c.tz-c.z,dd=Math.sqrt(dx*dx+dz*dz);
if(dd<0.5){c.state='idle';c.idleT=2+Math.random()*3;}
else{
var want=Math.atan2(dx,dz);c.yaw+=Math.max(-2.5*dt,Math.min(2.5*dt,angDiff(want,c.yaw)));
c.x+=Math.sin(c.yaw)*c.speed*dt;c.z+=Math.cos(c.yaw)*c.speed*dt;
}
}
c.curT-=dt;if(c.curT<=0){c.curious=!c.curious;c.curT=3+Math.random()*3;}
var hd=m.headG.getWorldPosition(v1).distanceTo(eyeH);
var toV=Math.atan2(visitor.x-c.x,visitor.z-c.z);
var tgt=(c.curious&&hd<22)?Math.max(-1.1,Math.min(1.1,angDiff(toV,c.yaw))):0;
c.headY+=(tgt-c.headY)*Math.min(1,dt*5);
var hp=m.headG.getWorldPosition(v1),dv=v2.set(eyeH.x-hp.x,eyeH.y-hp.y,eyeH.z-hp.z),dist=dv.length();dv.normalize();
m.headG.getWorldQuaternion(fq);var hf=new THREE.Vector3(0,0,1).applyQuaternion(fq);
var G=new THREE.Vector3(Math.sin(visitor.yaw)*Math.cos(visitor.pitch),Math.sin(visitor.pitch),Math.cos(visitor.yaw)*Math.cos(visitor.pitch));
if(view==='out'){G.set(Math.sin(visitor.yaw),0,Math.cos(visitor.yaw));}
var toCat=new THREE.Vector3(hp.x-eyeH.x,hp.y-eyeH.y,hp.z-eyeH.z).normalize();
var gaze=G.dot(toCat)>Math.cos(view==='fps'?0.1:0.22),catLooks=hf.dot(dv)>0.8;
if(dist<24&&gaze&&catLooks){c.contactT+=dt;c.flash=1;}else c.contactT=Math.max(0,c.contactT-dt*2);
if(c.contactT>0.4){
var best=null,bd=1e9;
boxes.forEach(function(b){if(b.occ||b.resv)return;var d2=Math.hypot(b.x-c.x,b.z-c.z);if(d2<bd){bd=d2;best=b;}});
if(best){best.resv=true;c.box=best;c.state='flee';c.contactT=0;addLog('猫'+c.id+': 目が合った → 逃げ出した');showContact();}
else c.contactT=0;
}
}
if(c.state==='flee'){
var fx=c.box.x-c.x,fz=c.box.z-c.z,fd=Math.sqrt(fx*fx+fz*fz);
var wnt=Math.atan2(fx,fz);c.yaw+=Math.max(-9*dt,Math.min(9*dt,angDiff(wnt,c.yaw)));
c.headY+=(0-c.headY)*Math.min(1,dt*8);
if(fd<2.4){c.state='jump';c.jt=0;c.jfrom.set(c.x,0,c.z);c.jto.set(c.box.x,0.05,c.box.z);}
else{c.x+=Math.sin(c.yaw)*6.5*dt;c.z+=Math.cos(c.yaw)*6.5*dt;}
}
if(c.state==='jump'){
c.jt+=dt;var u=Math.min(1,c.jt/0.8);
c.x=c.jfrom.x+(c.jto.x-c.jfrom.x)*u;c.z=c.jfrom.z+(c.jto.z-c.jfrom.z)*u;
if(u>=1){c.state='inbox';c.box.occ=true;c.box.resv=false;c.box.cat=c;c.box.lidT=0;c.yaw=Math.random()*6.28;addLog('猫'+c.id+': 箱に飛び込んだ');}
}
var fast=(c.state==='flee'||c.state==='jump');
m.root.position.set(c.x,0,c.z);m.root.rotation.y=c.yaw;
if(c.state==='wander'||c.state==='flee'){
c.phase+=dt*(fast?13:2.6+c.speed*2.2);
var amp=fast?0.95:0.55;
var sA=Math.sin(c.phase)*amp,sB=Math.sin(c.phase+(fast?0.7:Math.PI))*amp;
m.legs[0].rotation.x=sA;m.legs[3].rotation.x=sA;m.legs[1].rotation.x=sB;m.legs[2].rotation.x=sB;
m.bodyG.position.y=Math.sin(c.phase*2)*(fast?0.04:0.012);
m.bodyG.rotation.x=fast?Math.sin(c.phase)*0.12:0;
}else if(c.state==='idle'){
m.legs.forEach(function(l){l.rotation.x*=0.9;});m.bodyG.position.y=0;m.bodyG.rotation.x=0;
}else if(c.state==='jump'){
var u2=Math.min(1,c.jt/0.8);
m.root.position.y=Math.sin(u2*Math.PI)*1.35+u2*0.05;
var sc2=CATS+(0.75-CATS)*u2;m.root.scale.setScalar(sc2);
m.legs[0].rotation.x=-1.0;m.legs[1].rotation.x=-1.0;m.legs[2].rotation.x=0.9;m.legs[3].rotation.x=0.9;
m.bodyG.rotation.x=-0.35+u2*0.8;
}else if(c.state==='inbox'){
m.root.position.set(c.box.x,0.05,c.box.z);m.root.scale.setScalar(0.75);m.bodyG.position.y=0;m.bodyG.rotation.x=0;
m.legs.forEach(function(l){l.rotation.x=0;});
}
m.headG.rotation.y=c.headY;
m.tail.forEach(function(s,i){
var sw=Math.sin(t*(fast?9:2.2)+i*0.5+c.id)*(fast?0.1:0.07);
s.rotation.y=sw*(i+1)/3;
});
c.flash=Math.max(0,c.flash-dt*2);
var dEye=Math.hypot(visitor.x-c.x,visitor.z-c.z);
var gs=Math.min(0.5,(0.07+dEye*0.012))*(1+c.flash*0.5);
m.eyes.forEach(function(e){e.gl.scale.set(gs,gs,1);e.pupil.scale.x=0.2+0.5*Math.min(1,c.flash);e.em.color.setRGB(0.71+0.08*c.flash,0.83,0.23);});
}
function loop(ts){
var t=ts/1000,dt=Math.min(0.05,t-last);last=t;
night+=(nT-night)*Math.min(1,dt*2);
var bg=lc(0x87ceeb,0x0a0d1c,night);scene.background=bg;scene.fog.color.copy(bg);scene.fog.near=30+90*(1-night);scene.fog.far=120+200*(1-night);
amb.intensity=0.55+0.5*(1-night);moon.intensity=0.7+0.2*(1-night);moon.color.copy(lc(0xfff4dc,0xaab8ff,night));
starsMat.opacity=night;lampLights.forEach(function(l){l.intensity=0.9*night;});lampHeads.forEach(function(m){m.color.copy(lc(0xcccccc,0xffe9a0,night));});
groundMat.color.copy(lc(0x5fa04e,0x335a3a,night));leafMat.color.copy(lc(0x2f7a3a,0x1f4a2a,night));plazaMat.color.copy(lc(0xcdbf9f,0x8a8272,night));
if(visitor.tx!==null){
var dx=visitor.tx-visitor.x,dz=visitor.tz-visitor.z,dd=Math.sqrt(dx*dx+dz*dz);
if(dd<0.25){visitor.tx=null;vring.visible=false;}
else{var st=Math.min(dd,2.2*dt);visitor.x+=dx/dd*st;visitor.z+=dz/dd*st;if(view==='out')visitor.yaw=Math.atan2(dx,dz);}
}
cats.forEach(function(c){update(c,t,dt);});
boxes.forEach(function(b){
if(b.occ&&!b.closed){
b.lidT+=dt;
var p=Math.max(0,Math.min(1,(b.lidT-0.5)/0.8)),e=p*p*(3-2*p);
b.flaps.forEach(function(f){f.rotation.x=f.userData.open*(1-e);});
if(p>=1){b.closed=true;if(b.cat){b.cat.m.root.visible=false;addLog('箱のふたが閉まった(中は見えない)');}}
}
});
vg.position.set(visitor.x,0,visitor.z);vg.rotation.y=visitor.yaw;vg.visible=(view==='out');
drawHud();
if(view==='fps'){
camera.position.set(visitor.x,1.6,visitor.z);camera.fov=58;camera.up.set(0,1,0);
v1.set(Math.sin(visitor.yaw)*Math.cos(visitor.pitch),Math.sin(visitor.pitch),Math.cos(visitor.yaw)*Math.cos(visitor.pitch)).add(camera.position);
camera.lookAt(v1);
}else{
camera.fov=55;camera.up.set(0,1,0);
var th=auto?theta+Math.sin(t*0.08)*0.4:theta;
camera.position.set(oT.x+40*Math.sin(phi)*Math.sin(th),oT.y+40*Math.cos(phi),oT.z+40*Math.sin(phi)*Math.cos(th));
camera.lookAt(oT);
}
camera.updateProjectionMatrix();
renderer.render(scene,camera);
requestAnimationFrame(loop);
}
window.addEventListener('resize',function(){W=wrap.clientWidth;H=wrap.clientHeight;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();});
resetAll();
requestAnimationFrame(loop);
})();
</script>
