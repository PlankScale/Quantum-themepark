var wisps=new THREE.Points(wgeo,new THREE.PointsMaterial({map:rad([[0,'rgba(170,200,255,1)'],[0.4,'rgba(130,120,255,0.5)'],[1,'rgba(100,80,255,0)']],64),size:1.1,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
wisps.frustumCulled=false;scene.add(wisps);
var ripples=[];
function addRipple(){
var m=new THREE.Mesh(new THREE.RingGeometry(0.4,0.65,32),new THREE.MeshBasicMaterial({color:0xaab0ff,transparent:true,opacity:0.9,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
m.position.copy(qInfo.exitP);m.lookAt(qInfo.exitP.x+qInfo.dir.x,qInfo.exitP.y,qInfo.exitP.z+qInfo.dir.z);scene.add(m);ripples.push({m:m,t:0});
}
var qfx=document.getElementById('qfx'),info=document.getElementById('info'),sub=document.getElementById('sub'),vctl=document.getElementById('vctl'),bEl={};
var view='out',yaw=0,pitch=-0.05,theta=0.2,phi=1.05,auto=true;
function mkBtn(id,label,fn){var b=document.createElement('button');b.textContent=label;b.addEventListener('click',fn);vctl.appendChild(b);bEl[id]=b;}
function sty(){
[['out',''],['tps',''],['car',''],['cab','']].forEach(function(a){var on=view===a[0];bEl[a[0]].style.background=on?'#f2d48a':'rgba(27,24,48,0.9)';bEl[a[0]].style.color=on?'#1b1830':'#fff';});
var h={out:'ドラッグで視点を回せます',tps:'TPS: 列車を後ろ上から追います',car:'客車内: 窓から外が見えます。ドラッグで見回せます',cab:'運転席: 機関車の運転台からの視点です。ドラッグで見回せます'};
document.getElementById('hint').textContent=h[view];
}
mkBtn('out','俯瞰',function(){view='out';auto=true;sty();});
mkBtn('tps','TPS',function(){view='tps';sty();});
mkBtn('car','客車内(FPS)',function(){view='car';yaw=1.25;pitch=-0.05;sty();});
mkBtn('cab','運転席(FPS)',function(){view='cab';yaw=0;pitch=-0.05;sty();});
sty();
var dragging=false,lx=0,ly=0;
cv.addEventListener('pointerdown',function(e){dragging=true;auto=false;lx=e.clientX;ly=e.clientY;cv.style.cursor='grabbing';cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',function(e){
if(!dragging)return;
var dx=e.clientX-lx,dy=e.clientY-ly;
if(view==='car'||view==='cab'){yaw=Math.max(-2.6,Math.min(2.6,yaw-dx*0.005));pitch=Math.max(-0.8,Math.min(0.8,pitch-dy*0.004));}
else{theta-=dx*0.006;phi=Math.max(0.4,Math.min(1.5,phi-dy*0.006));}
lx=e.clientX;ly=e.clientY;
});
function up(){dragging=false;cv.style.cursor='grab';}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);

var oT=V(0,4,-32),tmp=V(0,0,0),fq=new THREE.Quaternion(),last=0,subOn=false,ripT=0;
function frame(ts){
var t=ts/1000,dt=Math.min(0.05,t-last);last=t;
var Lh=Math.floor(D/lapLen),sh=D-Lh*lapLen;
if(Lh!==lastLap){lastLap=Lh;departed=false;}
var target=vmax;
if(state==='stopped'){speed=0;dwell-=dt;target=0;if(dwell<=0){state='run';departed=true;}}
else if(!departed&&sh<STOPH){var rem=STOPH-sh;target=Math.min(vmax,Math.max(0.6,Math.sqrt(2*1.4*rem)));if(rem<0.15){state='stopped';dwell=6;speed=0;D=Lh*lapLen+STOPH;target=0;}}
if(state!=='stopped'){speed+=Math.max(-2.2*dt,Math.min(1.4*dt,target-speed));D+=speed*dt;}
placeCars();
var Dm=D-defs[2].c,Lm=Math.floor(Dm/lapLen),sm=Dm-Lm*lapLen,inQ=(sm>=QD0&&sm<=QD1);
if(inQ!==subOn){subOn=inQ;sub.style.opacity=inQ?'1':'0';}
var near=false,xm=xqs[2];
xqs.forEach(function(x){if(x>-12&&x<5)near=true;});
qInfo.plug.material.opacity=near?0.45:1;
var pulse=0.3+0.12*Math.sin(t*4);qInfo.shim.material.opacity=pulse;qInfo.shim2.material.opacity=pulse;
var emit=false;xqs.forEach(function(x){if(x>-1&&x<12)emit=true;});
if(emit){
var cnt=0;for(var w=0;w<WN&&cnt<4;w++){if(wlife[w]<=0){
var ang=Math.random()*6.28,rr=Math.random()*3.0,ex=qInfo.exitP,dr=qInfo.dir,nr2=V(-dr.z,0,dr.x);
wpos[w*3]=ex.x+nr2.x*Math.cos(ang)*rr;wpos[w*3+1]=ex.y+Math.sin(ang)*rr*0.9;wpos[w*3+2]=ex.z+nr2.z*Math.cos(ang)*rr;
wvel[w].set(dr.x*(2+Math.random()*4)+(Math.random()-0.5),Math.random()*1.2,dr.z*(2+Math.random()*4)+(Math.random()-0.5));wlife[w]=1.4+Math.random()*0.8;cnt++;}}
ripT-=dt;if(ripT<=0){addRipple();ripT=0.35;}
}
for(var w2=0;w2<WN;w2++){
if(wlife[w2]>0){wlife[w2]-=dt;wpos[w2*3]+=wvel[w2].x*dt;wpos[w2*3+1]+=wvel[w2].y*dt;wpos[w2*3+2]+=wvel[w2].z*dt;if(wlife[w2]<=0)wpos[w2*3+1]=-100;}
}
wgeo.attributes.position.needsUpdate=true;
for(var r=ripples.length-1;r>=0;r--){var rp=ripples[r];rp.t+=dt;var k=rp.t/1.0;rp.m.scale.set(1+k*7,1+k*7,1);rp.m.material.opacity=0.9*(1-k);if(k>=1){scene.remove(rp.m);ripples.splice(r,1);}}
smokeT-=dt;
var loco=defs[0].g;
if(smokeT<=0){smokeT=0.12;for(var s=0;s<smoke.length;s++){if(smoke[s].life<=0){tmpS.set(0,4.9,3.9);loco.localToWorld(tmpS);smoke[s].sp.position.copy(tmpS);smoke[s].life=smoke[s].max;smoke[s].v.set((Math.random()-0.5)*0.6,3.0+Math.random(),(Math.random()-0.5)*0.6);smoke[s].sp.visible=true;break;}}}
smoke.forEach(function(s){if(s.life>0){s.life-=dt;var age=1-s.life/s.max;s.sp.position.addScaledVector(s.v,dt);var sc=1.0+age*3.6;s.sp.scale.set(sc,sc,1);s.sp.material.opacity=0.55*(1-age);if(s.life<=0)s.sp.visible=false;}});
aRings.forEach(function(a,i){a.g.rotation.y+=0.004*(i%2?1:-1);});
var chn=pick(Lh)===0?'北回り':'南回り';
info.innerHTML='経路: '+chn+'<br>状態: '+(state==='stopped'?'停車中(乗降)':(speed<1?'発車・停車へ':'走行中'))+'<br>速度: '+Math.round(speed*3.6)+' km/h';
var qi=0;if(view!=='out'){var ax=Math.abs(xm);qi=Math.max(0,1-ax/9);}
qfx.style.opacity=String(qi*0.9);
if(view==='car'||view==='cab'){
var g2=(view==='car')?defs[2].g:defs[0].g;
if(view==='car')tmp.set(-0.4,2.35,0.5);else tmp.set(0.55,2.95,-2.2);
g2.localToWorld(tmp);camera.position.copy(tmp);camera.up.set(0,1,0);camera.fov=70;
g2.getWorldQuaternion(fq);var f=V(0,0,1).applyQuaternion(fq);var base=Math.atan2(f.x,f.z),pp=Math.asin(Math.max(-1,Math.min(1,f.y)));
var yy=base+yaw,pi2=pp+pitch;
tmp.set(Math.sin(yy)*Math.cos(pi2),Math.sin(pi2),Math.cos(yy)*Math.cos(pi2)).add(camera.position);camera.lookAt(tmp);
}else if(view==='tps'){
loco.getWorldQuaternion(fq);var f2=V(0,0,1).applyQuaternion(fq);
var hp=loco.position;camera.up.set(0,1,0);camera.fov=55;
camera.position.set(hp.x-f2.x*22+f2.z*8,hp.y+10,hp.z-f2.z*22-f2.x*8);camera.lookAt(hp.x+f2.x*8,hp.y+2,hp.z+f2.z*8);
}else{
camera.fov=55;camera.up.set(0,1,0);
var th=auto?theta+Math.sin(t*0.07)*0.3:theta;
camera.position.set(oT.x+190*Math.sin(phi)*Math.sin(th),oT.y+190*Math.cos(phi),oT.z+190*Math.sin(phi)*Math.cos(th));
camera.lookAt(oT);
}
camera.updateProjectionMatrix();
renderer.render(scene,camera);
requestAnimationFrame(frame);
}
window.addEventListener('resize',function(){W=wrap.clientWidth;H=wrap.clientHeight;renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();});
requestAnimationFrame(frame);
})();
</script>
</div></body></html>
